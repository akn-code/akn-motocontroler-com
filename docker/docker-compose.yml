services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motocontroler
      POSTGRES_USER: motocontroler
      POSTGRES_PASSWORD: motocontroler
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motocontroler"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "4321:3000"
    environment:
      DATABASE_URL: postgres://motocontroler:motocontroler@db:5432/motocontroler
      AUTH_SECRET: ${AUTH_SECRET:-changeme-docker-secret-32chars!!}
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
